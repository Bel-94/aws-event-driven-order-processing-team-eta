<article class="fb-card group flex h-full flex-col overflow-hidden transition hover:-translate-y-0.5 hover:shadow-[0_18px_50px_-30px_rgba(20,25,22,0.55)]">
  <div class="relative aspect-[4/3] overflow-hidden bg-mist">
    <img
      [src]="product.imageUrl"
      [alt]="product.name"
      class="h-full w-full object-cover transition duration-500 group-hover:scale-[1.03]"
      loading="lazy"
    />
    <span
      class="absolute left-3 top-3 rounded-full px-2.5 py-1 text-[11px] font-semibold"
      [class.bg-white/90]="product.availability === 'In stock'"
      [class.text-leaf-800]="product.availability === 'In stock'"
      [class.bg-amber-50]="product.availability === 'Low stock'"
      [class.text-amber-800]="product.availability === 'Low stock'"
      [class.bg-orange-50]="product.availability === 'Out of stock'"
      [class.text-warn]="product.availability === 'Out of stock'"
    >
      {{ product.availability }}
    </span>
  </div>

  <div class="flex flex-1 flex-col p-4">
    <p class="text-xs font-medium uppercase tracking-wide text-ink-soft">{{ product.category }}</p>
    <h3 class="mt-1 font-semibold text-ink">{{ product.name }}</h3>
    <p class="mt-1 text-sm text-ink-soft">{{ product.weight }}</p>

    <div class="mt-3 flex items-center gap-1 text-sm text-ink-soft">
      <span class="material-symbols-outlined filled text-[16px] text-amber-500">star</span>
      <span class="font-medium text-ink">{{ product.rating.toFixed(1) }}</span>
      <span>({{ product.reviewCount }})</span>
    </div>

    <div class="mt-auto flex items-center justify-between gap-3 pt-4">
      <p class="font-display text-xl font-semibold text-ink">
        {{ product.price | currency: product.currency }}
      </p>
      <button
        type="button"
        class="fb-btn-primary !px-3 !py-2"
        (click)="add()"
        [disabled]="product.availability === 'Out of stock'"
        [attr.aria-label]="'Add ' + product.name + ' to cart'"
      >
        <span class="material-symbols-outlined text-[18px]">add</span>
        Add
      </button>
    </div>
  </div>
</article>
