AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Order Intake Lambda and its IAM execution role.
  Week 2: validates order, writes PENDING to DynamoDB, then publishes
  OrderPlaced to the custom EventBridge bus.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Must match the environment used when deploying the DynamoDB stack.

  DynamoDBStackName:
    Type: String
    Default: order-processing-db
    Description: >
      Name of the CloudFormation stack that created the DynamoDB table.

  EventBridgeStackName:
    Type: String
    Default: order-processing-events
    Description: >
      Name of the CloudFormation stack that created the EventBridge bus
      (infrastructure/eventbridge.yaml). Used to import bus name and ARN.

Resources:
  OrderIntakeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "order-intake-execution-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OrderIntakeDynamoDBWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - Fn::ImportValue: !Sub "${DynamoDBStackName}-OrdersTableArn"
        - PolicyName: OrderIntakeEventBridgePublish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - Fn::ImportValue: !Sub "${EventBridgeStackName}-EventBusArn"

  OrderIntakeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "order-intake-${Environment}"
      Description: >
        Validates orders, writes PENDING to DynamoDB, publishes OrderPlaced.
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt OrderIntakeExecutionRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          ORDERS_TABLE_NAME:
            Fn::ImportValue: !Sub "${DynamoDBStackName}-OrdersTableName"
          EVENT_BUS_NAME:
            Fn::ImportValue: !Sub "${EventBridgeStackName}-EventBusName"
          EVENT_SOURCE: order.processing
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 200,
            body: JSON.stringify({ message: "placeholder — deploy real code via CLI" })
          });
      Tags:
        - Key: Project
          Value: order-processing
        - Key: Week
          Value: "2"
        - Key: Owner
          Value: lambda-order-intake

Outputs:
  OrderIntakeFunctionArn:
    Description: ARN of the Order Intake Lambda — pass this to the API Gateway stack
    Value: !GetAtt OrderIntakeFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OrderIntakeFunctionArn"

  OrderIntakeFunctionName:
    Description: Name of the Order Intake Lambda
    Value: !Ref OrderIntakeFunction
    Export:
      Name: !Sub "${AWS::StackName}-OrderIntakeFunctionName"

  OrderIntakeRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt OrderIntakeExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OrderIntakeRoleArn"
