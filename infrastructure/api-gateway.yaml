AWSTemplateFormatVersion: "2010-09-09"
Description: >
  API Gateway entry point for Event-Driven Order Processing.
  POST /orders -> Order Intake Lambda, with Cognito JWT auth,
  request body validation, and stage throttling (Auth & API Security).
  Optional Week 3 access logging via EnableAccessLogging=true.

Parameters:
  ProjectName:
    Type: String
    Default: order-processing
    Description: Prefix used in resource names and tags.

  StageName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: API stage (appears in the invoke URL).

  OrderIntakeFunctionArn:
    Type: String
    Default: ""
    Description: >
      Full ARN of the Order Intake Lambda.
      Leave empty only if you pass OrderIntakeFunctionName instead.

  OrderIntakeFunctionName:
    Type: String
    Default: ""
    Description: Function name of Order Intake Lambda if you do not have the ARN yet.

  CognitoStackName:
    Type: String
    Default: order-processing-cognito
    Description: >
      CloudFormation stack from infrastructure/cognito.yaml that exports
      the User Pool ARN for the COGNITO_USER_POOLS authorizer.

  EnableAccessLogging:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Set to true only after observability.yaml is deployed.

  ThrottleRateLimit:
    Type: Number
    Default: 10
    Description: Steady-state requests per second for this stage (/*).

  ThrottleBurstLimit:
    Type: Number
    Default: 20
    Description: Burst concurrency for this stage (/*).

Conditions:
  HasFunctionArn: !Not [!Equals [!Ref OrderIntakeFunctionArn, ""]]
  HasFunctionName: !Not [!Equals [!Ref OrderIntakeFunctionName, ""]]
  AccessLoggingEnabled: !Equals [!Ref EnableAccessLogging, "true"]

Resources:
  OrdersRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-orders-api"
      Description: >
        POST /orders with Cognito auth, body validation, and throttling.
        Clients always call HTTPS execute-api URLs (no HTTP endpoint).
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Week
          Value: "2"
        - Key: Owner
          Value: api-gateway

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref OrdersRestApi
      ParentId: !GetAtt OrdersRestApi.RootResourceId
      PathPart: orders

  # ---------------------------------------------------------------------------
  # Cognito JWT authorizer
  # ---------------------------------------------------------------------------
  OrdersCognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub "${ProjectName}-cognito-authorizer"
      RestApiId: !Ref OrdersRestApi
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - Fn::ImportValue: !Sub "${CognitoStackName}-UserPoolArn"

  # ---------------------------------------------------------------------------
  # Request body validation (rejects bad JSON shapes before Lambda runs)
  # ---------------------------------------------------------------------------
  OrdersRequestValidator:
    Type: AWS::ApiGateway::RequestValidator
    Properties:
      Name: !Sub "${ProjectName}-validate-body"
      RestApiId: !Ref OrdersRestApi
      ValidateRequestBody: true
      ValidateRequestParameters: false

  CreateOrderModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref OrdersRestApi
      ContentType: application/json
      Name: CreateOrderRequest
      Description: Minimum body required to place an order
      Schema:
        $schema: "http://json-schema.org/draft-04/schema#"
        title: CreateOrderRequest
        type: object
        required:
          - customerId
          - items
        additionalProperties: true
        properties:
          customerId:
            type: string
            minLength: 1
          customerEmail:
            type: string
            minLength: 3
            description: Optional shopper email for SES confirmation (Notification consumer)
          currency:
            type: string
            pattern: "^[A-Z]{3}$"
          items:
            type: array
            minItems: 1
            items:
              type: object
              required:
                - sku
                - quantity
                - unitPrice
              properties:
                sku:
                  type: string
                  minLength: 1
                productName:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
                unitPrice:
                  type: number
                  minimum: 0
                currency:
                  type: string
                  pattern: "^[A-Z]{3}$"

  OrdersPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref OrdersRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref OrdersCognitoAuthorizer
      ApiKeyRequired: false
      RequestValidatorId: !Ref OrdersRequestValidator
      RequestModels:
        application/json: !Ref CreateOrderModel
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FnArn}/invocations"
          - FnArn: !If
              - HasFunctionArn
              - !Ref OrderIntakeFunctionArn
              - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${OrderIntakeFunctionName}"

  # Browser preflight for Amplify / local SPA calling POST /orders
  OrdersOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref OrdersRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      ApiKeyRequired: false
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  OrdersApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - OrdersPostMethod
      - OrdersOptionsMethod
      - OrdersCognitoAuthorizer
      - OrdersRequestValidator
      - CreateOrderModel
    Properties:
      RestApiId: !Ref OrdersRestApi
      Description: !Sub "Deploy ${ProjectName} orders API (auth + validation + CORS)"

  OrdersApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: !Ref StageName
      RestApiId: !Ref OrdersRestApi
      DeploymentId: !Ref OrdersApiDeployment
      Description: !Sub "${ProjectName} ${StageName} stage"
      MethodSettings: !If
        - AccessLoggingEnabled
        - - ResourcePath: "/*"
            HttpMethod: "*"
            LoggingLevel: INFO
            MetricsEnabled: true
            DataTraceEnabled: true
            ThrottlingRateLimit: !Ref ThrottleRateLimit
            ThrottlingBurstLimit: !Ref ThrottleBurstLimit
        - - ResourcePath: "/*"
            HttpMethod: "*"
            MetricsEnabled: true
            ThrottlingRateLimit: !Ref ThrottleRateLimit
            ThrottlingBurstLimit: !Ref ThrottleBurstLimit
      AccessLogSetting: !If
        - AccessLoggingEnabled
        - DestinationArn:
            Fn::ImportValue: !Sub "${ProjectName}-ApiGatewayAccessLogGroupArn"
          Format: >
            {
              "requestId":"$context.requestId",
              "ip":"$context.identity.sourceIp",
              "httpMethod":"$context.httpMethod",
              "resourcePath":"$context.resourcePath",
              "status":"$context.status",
              "responseTime":"$context.responseLatency",
              "user":"$context.authorizer.claims.sub"
            }
        - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Week
          Value: "2"

  OrderIntakeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !If
        - HasFunctionArn
        - !Ref OrderIntakeFunctionArn
        - !Ref OrderIntakeFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/orders"
        - ApiId: !Ref OrdersRestApi

Outputs:
  ApiId:
    Description: Rest API ID
    Value: !Ref OrdersRestApi
    Export:
      Name: !Sub "${ProjectName}-ApiId"

  OrdersPostUrl:
    Description: Full HTTPS URL for POST /orders (requires Cognito Bearer token)
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/orders"
      - ApiId: !Ref OrdersRestApi
        Stage: !Ref StageName
    Export:
      Name: !Sub "${ProjectName}-OrdersPostUrl"

  RootUrl:
    Description: API stage base URL (HTTPS only)
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
      - ApiId: !Ref OrdersRestApi
        Stage: !Ref StageName

  CognitoAuthorizerId:
    Description: Authorizer ID attached to POST /orders
    Value: !Ref OrdersCognitoAuthorizer
