AWSTemplateFormatVersion: "2010-09-09"
Description: >
  EventBridge custom bus and OrderPlaced routing rules.
  Fans the same OrderPlaced event out to Payment, Inventory, and the
  Notification SQS queue. Payment and Inventory are called directly.
  Notification goes through SQS so failed events are buffered and retried
  rather than dropped.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  ProjectName:
    Type: String
    Default: order-processing

  PaymentFunctionArn:
    Type: String
    Description: ARN of the Payment consumer Lambda (from consumers stack output).

  InventoryFunctionArn:
    Type: String
    Description: ARN of the Inventory consumer Lambda.

  SQSStackName:
    Type: String
    Default: order-processing-sqs
    Description: >
      Name of the SQS stack. The Notification queue ARN is imported from here
      and used as the EventBridge target in place of the Notification Lambda.

Resources:

  # ---------------------------------------------------------------------------
  # Custom event bus — keeps project events off the default bus
  # ---------------------------------------------------------------------------
  OrderProcessingEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${ProjectName}-${Environment}"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Week
          Value: "2"

  # ---------------------------------------------------------------------------
  # OrderPlaced rule
  # Payment and Inventory are targeted directly.
  # Notification is targeted via SQS — EventBridge puts the event on the queue
  # and the Notification Lambda picks it up from there.
  # ---------------------------------------------------------------------------
  OrderPlacedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-order-placed-${Environment}"
      Description: Route OrderPlaced events to Payment, Inventory, and Notification queue
      EventBusName: !Ref OrderProcessingEventBus
      State: ENABLED
      EventPattern:
        source:
          - order.processing
        detail-type:
          - OrderPlaced
      Targets:
        - Id: PaymentProcessor
          Arn: !Ref PaymentFunctionArn

        - Id: InventoryUpdate
          Arn: !Ref InventoryFunctionArn

        # SQS target — EventBridge delivers the event as a message body.
        # The Notification Lambda reads and parses this message from the queue.
        - Id: NotificationQueue
          Arn:
            Fn::ImportValue: !Sub "${SQSStackName}-NotificationQueueArn"

  # ---------------------------------------------------------------------------
  # Invoke permissions for the Lambda targets
  # ---------------------------------------------------------------------------
  PaymentInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PaymentFunctionArn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OrderPlacedRule.Arn

  InventoryInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref InventoryFunctionArn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OrderPlacedRule.Arn

  # No Lambda permission needed for the SQS target.
  # The queue policy in sqs-dlq.yaml already allows events.amazonaws.com
  # to call sqs:SendMessage on the queue.

Outputs:
  EventBusName:
    Description: Pass this to Order Intake as EVENT_BUS_NAME
    Value: !Ref OrderProcessingEventBus
    Export:
      Name: !Sub "${AWS::StackName}-EventBusName"

  EventBusArn:
    Description: ARN for IAM events:PutEvents resource scope
    Value: !GetAtt OrderProcessingEventBus.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EventBusArn"

  OrderPlacedRuleArn:
    Description: ARN of the OrderPlaced routing rule
    Value: !GetAtt OrderPlacedRule.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OrderPlacedRuleArn"
