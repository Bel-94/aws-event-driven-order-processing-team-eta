AWSTemplateFormatVersion: "2010-09-09"
Description: >
  DynamoDB table for storing customer orders, with GSIs for
  customer order history and status-based processing queries.
  Week 3: optional customer-managed KMS key from data_security.yaml.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment, used in the table name.

  ProjectName:
    Type: String
    Default: order-processing
    Description: Must match ProjectName used in data_security.yaml exports.

  UseCustomerManagedKey:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      When true, encrypts the table with the CMK exported by data_security
      (${ProjectName}-${Environment}-data-key-arn). Deploy data_security first.
      Set false only for a quick AWS-owned key bootstrap without that stack.

Conditions:
  UseCmk: !Equals [!Ref UseCustomerManagedKey, "true"]

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "Orders-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: customerId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CustomerIndex
          KeySchema:
            - AttributeName: customerId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification: !If
        - UseCmk
        - SSEEnabled: true
          SSEType: KMS
          KMSMasterKeyId:
            Fn::ImportValue: !Sub "${ProjectName}-${Environment}-data-key-arn"
        - SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  OrdersTableName:
    Description: Name of the Orders DynamoDB table
    Value: !Ref OrdersTable
    Export:
      Name: !Sub "${AWS::StackName}-OrdersTableName"

  OrdersTableArn:
    Description: ARN of the Orders DynamoDB table
    Value: !GetAtt OrdersTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OrdersTableArn"
